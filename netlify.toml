[build]
  command = "node scripts/build.mjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/telegram-auth"
  to = "/.netlify/functions/telegram-auth"
  status = 200
